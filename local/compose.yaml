services:
  mysql:
    image: mysql:8.4
    container_name: kdt-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"   # 각 서비스 application.properties의 값과 일치해야 함
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - kdt-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8
    container_name: kdt-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]   # 재시작해도 대기열/순번 유지
    volumes:
      - kdt-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kdt-mysql-data:
  kdt-redis-data:
