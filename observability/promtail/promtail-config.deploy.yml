server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${MONITORING_PRIVATE_IP}:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-services
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/services/**/*.json

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            traceId: traceId
      - labels:
          level:
          service:
      - timestamp:
          source: "@timestamp"
          format: RFC3339
