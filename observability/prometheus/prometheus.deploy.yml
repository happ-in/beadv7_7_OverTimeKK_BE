# EC2#2(모니터링) 배포용 템플릿. Prometheus는 promtail과 달리 설정 파일 내 런타임 환경변수 확장을
# 지원하지 않으므로, deploy-monitoring.yml 워크플로우가 APP_PRIVATE_IP_PLACEHOLDER를
# 실제 EC2#1 프라이빗 IP(secrets.APP_PRIVATE_IP)로 sed 치환한 뒤 EC2#2로 배포함.
# 로컬 개발용은 observability/prometheus/prometheus.yml(host.docker.internal 기준) 그대로 사용.

global:
  scrape_interval: 15s
  evaluation_interval: 1m

scrape_configs:
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'APP_PRIVATE_IP_PLACEHOLDER:8081' ]

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'APP_PRIVATE_IP_PLACEHOLDER:8082' ]

  - job_name: 'performance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'APP_PRIVATE_IP_PLACEHOLDER:8083' ]

  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'APP_PRIVATE_IP_PLACEHOLDER:8080' ]
