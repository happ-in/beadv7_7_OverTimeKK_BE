services:
  prometheus:
    image: prom/prometheus:latest
    container_name: kdt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - observability-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:latest
    container_name: kdt-loki
    ports:
      - "3100:3100"
    volumes:
      - observability-loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: kdt-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/services:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.7.2
    container_name: kdt-tempo
    ports:
      - "3200:3200"   # query
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - observability-tempo-data:/var/tempo
    command: -config.file=/etc/tempo.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: kdt-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - observability-grafana-data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  observability-prometheus-data:
  observability-loki-data:
  observability-tempo-data:
  observability-grafana-data: