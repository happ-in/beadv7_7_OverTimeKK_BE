# HTTP: certbot 갱신용 챌린지 통로만 열어두고, 나머지는 HTTPS로 리다이렉트
server {
    listen 80;
    server_name reseat.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 실제 서비스
server {
    listen 443 ssl;
    server_name reseat.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/reseat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reseat.duckdns.org/privkey.pem;

    # user-service로 라우팅 (회원가입/로그인/토큰/회원정보)
    location /api/users {
        proxy_pass http://user-service:8081;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # order-service로 라우팅 (주문/결제/포인트 적립 관리)
    location ~ ^/api/(order|payments|admin/point-earn)(/|$) {
        proxy_pass http://order-service:8082;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # 나머지 /api/*는 전부 performance-service로 (performances, v2/performances, performance, tickets, standby)
    location /api/ {
        proxy_pass http://performance-service:8083;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # 그 외 전부 프론트(Next.js SSR)로 - /api/* prefix가 더 길게 매치되므로 순서 무관
    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
